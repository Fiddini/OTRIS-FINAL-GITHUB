Produk boleh berkembang jika memperkuat purpose. Struktur organisasi boleh berubah jika membantu purpose. Tetapi perubahan tersebut harus tetap menjaga purpose."],filter:["Apakah usulan ini memperkuat atau melemahkan purpose OTRIS?","Jika teknologi ini diganti 10 tahun lagi, apakah purpose OTRIS tetap terjaga?"],koneksi:["Engineering — Vendor Agnostic","Engineering — Local First"]},{num:3,title:"PHILOSOPHY",konstitusi:'Teknologi berada di bawah manusia. OTRIS tidak boleh menjadikan manusia sebagai pelengkap teknologi. OTRIS tidak boleh menggantikan penilaian klinis, tidak boleh mengambil keputusan otomatis yang mengorbankan keselamatan pasien, dan tidak boleh menjadikan tenaga medis sebagai operator dari sistem yang justru lebih "cerdas" dari mereka.',alasan:["Teknologi mempunyai kecenderungan menjadi tujuan ketika sistem semakin besar. Lebih banyak fitur tidak selalu berarti pelayanan menjadi lebih baik.","Karena itu setiap desain harus mempertahankan urutan yang tidak bisa dibalik: Humanity → Clinical Team → Medical Function → OTRIS → Technology.","Jika suatu desain menempatkan teknologi di atas manusia, desain tersebut harus diperbaiki."],filter:["Apakah desain ini mempermudah atau mempersulit kerja tenaga medis?","Apakah teknologi ini melayani manusia, atau manusia yang harus menyesuaikan diri dengan teknologi?"],koneksi:["Engineering — Audit First","Engineering — AI Boundary","Hardware — Human Serviceable"]},{num:4,title:"THREE FOUNDATIONS OF OTRIS",konstitusi:"OTRIS dibangun di atas tiga fondasi yang saling terkait dan tidak boleh ada yang hilang: 1. Lighthouse — memberi arah. 2. Humanist Design — menjaga manusia sebagai pusat. 3. Bridge — menghubungkan yang sebelumnya terpisah.",alasan:["Lighthouse memastikan OTRIS tetap mengetahui ke mana ia bergerak, bahkan ketika teknologi berubah.","Humanist Design memastikan sistem tidak menjadi beban bagi orang yang menggunakannya — perawat, dokter, teknisi, dan pasien.","Bridge memastikan teknologi digunakan untuk menghubungkan kemampuan, informasi, fasilitas, dan manusia."],filter:["Apakah desain ini memiliki arah yang jelas (Lighthouse)?","Apakah desain ini mempertimbangkan pengalaman manusia yang menggunakannya (Humanist Design)?","Apakah desain ini menghubungkan sesuatu yang sebelumnya terpisah (Bridge)?"],koneksi:["Engineering — Event Driven","Hardware — Physical Bridge"]},{num:5,title:"THE VALUES WE REFUSE TO COMPROMISE",konstitusi:"Nilai OTRIS tidak boleh berubah hanya karena keputusan yang lebih mudah atau lebih menguntungkan tersedia. Nilai menjadi batas sebelum keputusan teknis dan bisnis dilakukan: Keselamatan, Kemanusiaan, Keterbukaan terhadap audit, Tanggung jawab, Keberlanjutan, Kejujuran terhadap keterbatasan sistem, Penghormatan terhadap tenaga medis.",alasan:["Sistem dapat berfungsi secara teknis tetapi tetap salah secara nilai. Sebuah sistem yang bekerja sempurna tetapi melanggar privasi pasien, atau mempersulit kerja perawat, tetap salah.",'Keputusan tidak cukup hanya dibuktikan "bisa dibuat, murah, cepat, atau menguntungkan." Keputusan juga harus dapat menjawab: "Apakah keputusan ini masih sesuai dengan nilai OTRIS?"'],filter:["Apakah usulan ini memenuhi semua nilai OTRIS? Jika ada yang dilanggar, apa alternatifnya?","Apakah usulan ini jujur tentang keterbatasannya, atau mengklaim kemampuan yang tidak dimiliki?"],koneksi:["Engineering — Testability by Design","Engineering — Security by Design","Hardware — Failure Boundaries"]},{num:6,title:"MEDICAL SOVEREIGNTY",konstitusi:"OTRIS harus memperkuat kedaulatan medis, bukan menciptakan ketergantungan baru. Rumah sakit dan tenaga medis harus tetap mempunyai kemampuan untuk menjalankan pelayanan sesuai kewenangannya — dengan atau tanpa OTRIS. Fasilitas kesehatan harus tetap memiliki kendali yang sah atas penggunaan, akses, dan pengelolaan datanya.",alasan:["Jika OTRIS hanya berfungsi jika cloud tertentu aktif, atau hanya jika satu vendor tertentu menyediakan komponen, maka OTRIS justru menjadi hambatan bagi pelayanan medis, bukan pembantu.","Local capability tetap tersedia — sistem tetap berjalan tanpa internet. Data dapat ditelusuri. Komponen dapat diganti. Sistem dapat dipulihkan."],filter:["Apakah desain ini memperkuat atau melemahkan kendali rumah sakit atas sistem dan datanya?","Jika cloud mati, apakah fungsi klinis kritis tetap berjalan?"],koneksi:["Engineering — Local First","Engineering — Vendor Agnostic","Hardware — Hardware Sovereignty"]},{num:7,title:"HUMAN FIRST, HUMAN ALWAYS WINS",konstitusi:"Jika terdapat konflik antara kenyamanan teknologi dan keselamatan atau kewenangan manusia, manusia harus didahulukan. Tidak ada algoritma, tidak ada AI, tidak ada otomatisasi yang boleh mengambil alih tanggung jawab klinis dari tenaga medis.",alasan:["OTRIS membantu — memberikan informasi yang lebih baik. OTRIS menampilkan — menunjukkan data dengan jelas. OTRIS meneruskan — mengirimkan informasi ke tempat yang tepat. OTRIS mencatat — menyimpan jejak untuk audit.","Manusia yang berwenang memutuskan — dokter, perawat, dan tenaga medis yang bertanggung jawab. Batas ini harus tetap berlaku walaupun kemampuan teknologi di masa depan meningkat."],filter:["Apakah desain ini menggantikan keputusan manusia, atau memperkuat keputusan manusia?","Jika AI memberikan saran yang salah, apakah tenaga medis masih bisa mengambil keputusan yang benar?"],koneksi:["Engineering — AI Boundary","Engineering — Security by Design"]},{num:8,title:"STEWARDSHIP",konstitusi:"OTRIS harus dipandang sebagai amanah yang dijaga, bukan sekadar aset yang dimiliki. Setiap orang yang memegang authority atas OTRIS memiliki tanggung jawab untuk menyerahkannya kepada generasi berikutnya dalam keadaan lebih baik daripada saat ia menerimanya.",alasan:['Kepemilikan bertanya "Apa yang menjadi milik saya?" Stewardship bertanya "Apa yang harus saya jaga?"',"Authority tidak sama dengan kebebasan tanpa batas. Authority selalu membawa kewajiban menjaga. Setiap keputusan harus mempertimbangkan dampak jangka panjang."],filter:["Apakah keputusan ini menjaga OTRIS untuk generasi berikutnya, atau hanya menguntungkan jangka pendek?","Apakah keputusan ini mendokumentasikan pengetahuan yang cukup agar orang lain bisa melanjutkannya?"],koneksi:["Engineering — Documentation First","Hardware — Product Lifecycle"]},{num:9,title:"SACRED ASSETS",konstitusi:"Ada aset OTRIS yang tidak boleh hilang walaupun teknologi, perangkat, perusahaan, atau orang dapat berganti. Sacred Assets meliputi: Purpose, Constitution, Knowledge, Clinical Architecture, Trust, Humanity.",alasan:["Hardware dapat diganti. Software dapat ditulis ulang. Server dapat dipindahkan. Perusahaan dapat berubah.","Tetapi jika purpose, knowledge, trust, dan cara berpikir OTRIS hilang, maka yang tersisa mungkin masih menggunakan nama OTRIS — tetapi tidak lagi membawa identitas yang sama."],filter:["Apakah usulan ini melindungi atau mengancam Sacred Assets OTRIS?","Jika perusahaan ini tidak ada lagi 10 tahun dari sekarang, apakah Sacred Assets OTRIS masih bisa ditemukan dan dipahami?"],koneksi:["Engineering — One Concept, One Authority","Engineering — Knowledge Must Survive","Hardware — Quality Constitution"]},{num:10,title:"HOW WE MAKE DECISIONS",konstitusi:"Keputusan besar OTRIS tidak boleh dibuat hanya karena tekanan waktu, suara mayoritas sederhana, tren teknologi, atau kepentingan sesaat. Perubahan terhadap prinsip penting harus melalui mekanisme yang lebih ketat daripada keputusan operasional biasa.",alasan:["Semakin besar dampak sebuah perubahan terhadap identitas OTRIS, semakin tinggi standar bukti dan authority yang dibutuhkan.","Mengganti versi library dampaknya berhenti di level teknis. Mengubah purpose dampaknya menjalar ke seluruh Book II sampai Book XX sekaligus."],filter:["Apakah keputusan ini bersifat operasional atau konstitusional?","Jika konstitusional, apakah sudah melalui proses evaluasi yang memadai?"],koneksi:["Engineering — One Concept, One Authority","Hardware — Product Lifecycle"]},{num:11,title:"FAILURE PHILOSOPHY",konstitusi:"OTRIS tidak dibangun dengan asumsi bahwa sistem tidak pernah gagal. OTRIS dibangun dengan asumsi bahwa kegagalan dapat terjadi dan harus dipersiapkan. Setiap komponen, setiap jalur data, setiap modul, dan setiap proses harus memiliki batas kegagalan yang jelas dan terdefinisi.",alasan:["Komponen rusak. Jaringan putus. Daya padam. Software error. Manusia melakukan kesalahan. Vendor berhenti.","Sistem yang baik adalah sistem yang: Mendeteksi kegagalan, Membatasi dampaknya, Menjaga keadaan aman (fail-safe), Mencatat kejadian, Memungkinkan pemulihan."],filter:["Apa yang terjadi jika komponen ini gagal? Apakah sistem tetap aman?","Apakah kegagalan ini terdeteksi, tercatat, dan dapat dipulihkan?"],koneksi:["Engineering — Gateway First","Engineering — Testability by Design","Hardware — Failure Boundaries"]},{num:12,title:"CONTINUITY SOVEREIGNTY",konstitusi:"Tidak ada implementasi OTRIS yang boleh bergantung pada keberadaan, akses, atau pengetahuan satu individu. No implementation shall become dependent on the continued presence, access, or knowledge of a single individual.",alasan:["Orang dapat berhenti bekerja. Hubungan kerja dapat berubah. Credential dapat hilang. Programmer dapat pergi. Founder juga tidak akan berada selamanya.","Source code harus dapat diakses oleh tim yang berwenang. Documentation harus lengkap. Configuration terdokumentasi. Recovery knowledge tersedia. Build process dapat dijalankan oleh orang lain."],filter:["Jika orang yang membuat keputusan ini pergi besok, apakah sistem masih bisa dipahami dan dilanjutkan?","Apakah pengetahuan ini didokumentasikan dengan cukup untuk diwariskan?"],koneksi:["Engineering — Knowledge Must Survive","Hardware — Serviceability"]},{num:13,title:"KNOWLEDGE MUST SURVIVE",konstitusi:"Pengetahuan penting OTRIS harus disimpan dalam bentuk yang dapat dibaca, ditelusuri, diperiksa, dan diteruskan.",alasan:["Pengetahuan yang hanya berada dalam percakapan, kepala seseorang, atau satu file tanpa struktur pada akhirnya akan hilang.",'Bukan hanya "apa yang diputuskan" — tetapi juga: Mengapa keputusan tersebut dibuat, Apa alternatif yang dipertimbangkan, Apa risiko yang diidentifikasi, Siapa yang mengesahkan, Kapan keputusan dibuat, Bagaimana keputusan ini diuji.'],filter:["Apakah keputusan ini didokumentasikan dengan alasan yang jelas?","Apakah orang lain bisa memahami keputusan ini tanpa harus bertanya kepada pembuatnya?"],koneksi:["Engineering — One Concept, One Authority","Hardware — Quality Constitution"]},{num:14,title:"ONE CONCEPT, ONE AUTHORITY",konstitusi:"Setiap konsep penting OTRIS harus mempunyai satu sumber authority yang menjadi rujukan tunggal. Dokumen lain boleh mengacu dan menjelaskan dari sudut pandang lain, tetapi tidak boleh menciptakan kebenaran kedua. One Concept. One Authority.",alasan:["Dua dokumen yang sama-sama dianggap benar tetapi berisi aturan berbeda akan menghasilkan dua OTRIS yang saling bertentangan.","Single Source of Truth bukan berarti hanya ada satu dokumen. Artinya setiap keputusan mempunyai satu rumah resmi tempat konsep tersebut didefinisikan dan dikelola."],filter:["Di mana konsep ini didefinisikan secara resmi? Apakah ada sumber lain yang bertentangan?","Jika ada konflik antara dua sumber, mana yang memiliki authority lebih tinggi?"],koneksi:["Engineering — One Concept, One Authority","Hardware — Cross-Reference Map"]},{num:15,title:"TRACEABILITY",konstitusi:"Setiap implementasi penting OTRIS harus dapat ditelusuri kembali kepada alasan dan authority yang melahirkannya.",alasan:["Tanpa traceability, generasi berikutnya hanya melihat hasil akhir. Mereka tidak mengetahui mengapa suatu desain dibuat.","Hubungan idealnya: Constitution → Architecture → Engineering → Drawing → Implementation → Test → Product → Service → Change Record. Setiap bagian harus dapat ditelusuri ke bagian sebelumnya."],filter:["Apakah keputusan ini dapat ditelusuri ke alasan dan authority yang mendasarinya?","Jika seseorang bertanya 'mengapa ini dibuat seperti ini', apakah ada jawaban yang terdokumentasi?"],koneksi:["Engineering — Traceability","Hardware — Production Passport"]},{num:16,title:"EVOLUTION WITHOUT LOSS OF IDENTITY",konstitusi:"OTRIS harus dapat berubah tanpa kehilangan identitasnya.",alasan:["Constitution tidak boleh menjadi alasan untuk membekukan teknologi. Jika teknologi yang lebih baik tersedia, OTRIS harus dapat mengevaluasinya.","Tetapi teknologi baru tidak boleh diterima hanya karena baru. Ia harus diuji terhadap tujuh prinsip: Purpose, Human First, Medical Sovereignty, Nilai Keselamatan, Continuity Sovereignty, dan Traceability."],filter:["Apakah teknologi/desain baru ini sudah diuji terhadap semua prinsip OTRIS?","Jika teknologi ini diadopsi, apakah OTRIS masih bisa dikenal sebagai OTRIS?"],koneksi:["Engineering — Integration Over Replacement","Hardware — Product Lifecycle"]},{num:17,title:"WHAT WE LEAVE BEHIND",konstitusi:"Keberhasilan OTRIS tidak hanya diukur dari produk yang berhasil dibuat hari ini. Keberhasilan juga diukur dari kemampuan generasi berikutnya memahami, menjaga, dan melanjutkannya.",alasan:["Produk akan menjadi tua. Teknologi akan berganti. Tetapi sebuah institusi dapat bertahan jika alasan, pengetahuan, dan cara menjaga kualitasnya tetap diwariskan.","Dokumentasi bukan sekadar pelengkap, tetapi bagian dari produk itu sendiri. Constitution harus tetap hidup. Source code harus dapat dibaca oleh generasi berikutnya. Apa yang kita tinggalkan hari ini akan menjadi fondasi bagi generasi berikutnya."],filter:["Apakah yang kita bangun hari ini akan bisa dipahami dan dilanjutkan 10 tahun dari sekarang?","Apa yang akan hilang jika kita tidak mendokumentasikan keputusan ini?"],koneksi:["Engineering — Knowledge Must Survive","Hardware — Production Passport"]},{num:18,title:"TO THOSE WHO CONTINUE",konstitusi:"Generasi penerus memiliki hak untuk mengembangkan OTRIS. Tetapi mereka juga memiliki kewajiban memahami alasan sebelum mengubah sesuatu yang diwariskan.",alasan:["Generasi berikutnya tidak harus meniru seluruh teknologi generasi pertama. Mereka justru diharapkan membuatnya lebih baik.","Tetapi sebelum mengganti sebuah keputusan, mereka harus dapat menjawab: Mengapa keputusan lama dibuat? Apakah masalahnya masih sama? Apa yang berubah? Apa risiko perubahan baru? Bagaimana membuktikan bahwa hasil baru tetap sesuai Constitution?"],filter:["Jika sebuah keputusan lama diganti, apakah alasan di balik keputusan lama sudah dipahami dengan baik?","Apakah perubahan ini sudah diuji terhadap Constitution?"],koneksi:["Engineering — One Concept, One Authority","Hardware — Product Lifecycle"]}];function bu(){let[e,n]=Mn.useState(0),[t,r]=Mn.useState(0),l=Mn.useRef({});Mn.useEffect(()=>{let u=()=>{let i=window.scrollY,s=document.documentElement.scrollHeight-window.innerHeight;r(s>0?i/s:0);let c=0;for(let m=1;m<=18;m++){let v=l.current[`bab-${m}`];if(v){let h=v.getBoundingClientRect().top+window.scrollY-140;if(i>=h)c=m}}n(c)};return window.addEventListener("scroll",u,{passive:!0}),u(),()=>window.removeEventListener("scroll",u)},[]);let o=(u)=>{let i=l.current[u];if(i)i.scrollIntoView({behavior:"smooth",block:"start"})};return w("div",{className:"min-h-screen bg-[#fdfaf6] text-[#2b2117] antialiased selection:bg-[#2b2117] selection:text-[#fdfaf6]",children:[p("style",{children:`
